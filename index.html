<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Studio Dulce - Cotizador</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            padding: 15px;
        }
     .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(255, 154, 158, 0.3);
        }
        h1 {
            text-align: center;
            color: #d63384;
            margin-bottom: 5px;
            font-size: 24px;
        }
     .subtitle {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: #d63384;
            font-weight: 600;
            margin: 12px 0 5px;
            font-size: 14px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffb3d9;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
     .largos { display: none; }
     .largos.show { display: block; }
     .decoraciones {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
     .deco-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #ffb3d9;
        }
     .deco-item:last-child { border-bottom: none; }
     .deco-name { font-size: 13px; color: #333; }
     .deco-price { font-size: 11px; color: #d63384; font-weight: 600; }
     .deco-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
     .deco-controls button {
            width: 28px;
            height: 28px;
            border: none;
            background: #d63384;
            color: white;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
     .deco-controls span {
            min-width: 25px;
            text-align: center;
            font-weight: 600;
        }
     .extras {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
     .extra-box {
            background: rgba(255, 255, 255, 0.6);
            padding: 10px;
            border-radius: 10px;
        }
     .extra-box label { margin: 0 0 5px; font-size: 12px; }
     .total-box {
            background: linear-gradient(135deg, #d63384, #ff6b9d);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: center;
        }
     .total-label { font-size: 14px; opacity: 0.9; }
     .total-amount {
            font-size: 42px;
            font-weight: 700;
            margin: 5px 0;
        }
     .desglose {
            background: rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 11px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
     .btn-reset {
            width: 100%;
            padding: 12px;
            background: white;
            color: #d63384;
            border: 2px solid #d63384;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }
        small { color: #888; font-size: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Beauty Studio Dulce 💖</h1>
        <p class="subtitle">Cotizador de Uñas</p>
        
        <label>Técnica Base:</label>
        <select id="tecnica">
            <option value="0">Selecciona una técnica</option>
            <option value="acrilico">Acrílico / Soft Gel</option>
            <option value="gel">Gel Semipermanente - $150</option>
            <option value="rubber">Rubber Gel - $200</option>
        </select>

        <div id="largos" class="largos">
            <label>Largo:</label>
            <select id="largo">
                <option value="200">Largo 1 - $200</option>
                <option value="220">Largo 2 - $220</option>
                <option value="240">Largo 3 - $240</option>
                <option value="260">Largo 4 - $260</option>
                <option value="300">Largo 5 - $300</option>
                <option value="320">Largo 6 - $320</option>
                <option value="350">Largo 7 - $350</option>
                <option value="400">Largo 8 - $400</option>
                <option value="430">Largo 9 - $430</option>
            </select>
        </div>

        <label>Tonos Extra <small>(Incluye 2 gratis, $5 c/u extra)</small>:</label>
        <input type="number" id="tonos" min="0" value="0" placeholder="¿Cuántos tonos extra?">

        <label>Decoraciones <small>(Precio por uña)</small>:</label>
        <div class="decoraciones" id="decoraciones"></div>

        <label>Extras:</label>
        <div class="extras">
            <div class="extra-box">
                <label>Cambio de forma $20</label>
                <input type="checkbox" id="forma">
            </div>
            <div class="extra-box">
                <label>Retiro Acrílico $10/uña</label>
                <input type="number" id="retiroAcrilico" min="0" value="0" placeholder="Uñas">
            </div>
            <div class="extra-box">
                <label>Retiro Gel $8/uña</label>
                <input type="number" id="retiroGel" min="0" value="0" placeholder="Uñas">
            </div>
            <div class="extra-box">
                <label>Reposición Acrílico $30/uña</label>
                <input type="number" id="repoAcrilico" min="0" value="0" placeholder="Uñas">
            </div>
            <div class="extra-box">
                <label>Reposición Gel $20/uña</label>
                <input type="number" id="repoGel" min="0" value="0" placeholder="Uñas">
            </div>
        </div>

        <div class="total-box">
            <div class="total-label">TOTAL A COBRAR</div>
            <div class="total-amount" id="total">$0</div>
            <div class="desglose" id="desglose"></div>
        </div>

        <button class="btn-reset" onclick="resetear()">Limpiar Todo</button>
    </div>

    <script>
        const decoraciones = [
            { nombre: 'Espejo', precio: 5 },
            { nombre: 'Aurora', precio: 5 },
            { nombre: 'Azúcar', precio: 5 },
            { nombre: 'Suéter', precio: 5 },
            { nombre: 'Perla', precio: 5 },
            { nombre: 'Glitter', precio: 5 },
            { nombre: 'Carey', precio: 15 },
            { nombre: 'Blooming', precio: 5 },
            { nombre: 'Ojo de gato', precio: 5 },
            { nombre: 'Relieve', precio: 15 },
            { nombre: '3D', precio: 15 },
            { nombre: 'Francés', precio: 5 },
            { nombre: 'Nail art simple', precio: 5 },
            { nombre: 'Nail art complicado', precio: 15 },
            { nombre: 'Encapsulado', precio: 10 },
            { nombre: 'Naturaleza muerta', precio: 10 },
            { nombre: 'Dijes', precio: 15 },
            { nombre: 'Sticker', precio: 5 },
            { nombre: 'Baby boomer', precio: 15 },
            { nombre: 'Cristales Ch', precio: 20 },
            { nombre: 'Cristales M', precio: 30 },
            { nombre: 'Cristales G', precio: 40 },
            { nombre: 'Uña cristal Ch L1-3', precio: 50 },
            { nombre: 'Uña cristal M L4-6', precio: 80 },
            { nombre: 'Uña cristal G L7-9', precio: 100 }
        ];

        const cantidades = {};
        decoraciones.forEach(d => cantidades[d.nombre] = 0);

        function init() {
            const cont = document.getElementById('decoraciones');
            decoraciones.forEach(d => {
                const div = document.createElement('div');
                div.className = 'deco-item';
                div.innerHTML = `
                    <div>
                        <div class="deco-name">${d.nombre}</div>
                        <div class="deco-price">$${d.precio} por uña</div>
                    </div>
                    <div class="deco-controls">
                        <button onclick="cambiar('${d.nombre}', -1)">-</button>
                        <span id="cant-${d.nombre}">0</span>
                        <button onclick="cambiar('${d.nombre}', 1)">+</button>
                    </div>
                `;
                cont.appendChild(div);
            });
        }

        function cambiar(nombre, delta) {
            cantidades[nombre] = Math.max(0, cantidades[nombre] + delta);
            document.getElementById(`cant-${nombre}`).textContent = cantidades[nombre];
            calcular();
        }

        document.getElementById('tecnica').addEventListener('change', (e) => {
            document.getElementById('largos').classList.toggle('show', e.target.value === 'acrilico');
            calcular();
        });

        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', calcular);
            el.addEventListener('change', calcular);
        });

        function calcular() {
            let total = 0;
            let desglose = [];
            
            const tecnica = document.getElementById('tecnica').value;
            if (tecnica === 'acrilico') {
                const largo = parseInt(document.getElementById('largo').value);
                total += largo;
                desglose.push(`Acrílico/Soft Gel: $${largo}`);
            } else if (tecnica === 'gel') {
                total += 150;
                desglose.push(`Gel Semipermanente: $150`);
            } else if (tecnica === 'rubber') {
                total += 200;
                desglose.push(`Rubber Gel: $200`);
            }

            const tonos = parseInt(document.getElementById('tonos').value) || 0;
            if (tonos > 0) {
                const costoTonos = tonos * 5;
                total += costoTonos;
                desglose.push(`${tonos} tonos extra: $${costoTonos}`);
            }

            decoraciones.forEach(d => {
                if (cantidades[d.nombre] > 0) {
                    const subtotal = cantidades[d.nombre] * d.precio;
                    total += subtotal;
                    desglose.push(`${d.nombre} x${cantidades[d.nombre]}: $${subtotal}`);
                }
            });

            if (document.getElementById('forma').checked) {
                total += 20;
                desglose.push(`Cambio de forma: $20`);
            }

            const retiroA = parseInt(document.getElementById('retiroAcrilico').value) || 0;
            if (retiroA > 0) {
                total += retiroA * 10;
                desglose.push(`Retiro Acrílico x${retiroA}: $${retiroA * 10}`);
            }

            const retiroG = parseInt(document.getElementById('retiroGel').value) || 0;
            if (retiroG > 0) {
                total += retiroG * 8;
                desglose.push(`Retiro Gel x${retiroG}: $${retiroG * 8}`);
            }

            const repoA = parseInt(document.getElementById('repoAcrilico').value) || 0;
            if (repoA > 0) {
                total += repoA * 30;
                desglose.push(`Reposición Acrílico x${repoA}: $${repoA * 30}`);
            }

            const repoG = parseInt(document.getElementById('repoGel').value) || 0;
            if (repoG > 0) {
                total += repoG * 20;
                desglose.push(`Reposición Gel x${repoG}: $${repoG * 20}`);
            }

            document.getElementById('total').textContent = `$${total}`;
            document.getElementById('desglose').innerHTML = desglose.length? desglose.join('<br>') : 'Selecciona servicios';
        }

        function resetear() {
            document.getElementById('tecnica').value = '0';
            document.getElementById('largos').classList.remove('show');
            document.getElementById('tonos').value = 0;
            document.getElementById('forma').checked = false;
            document.getElementById('retiroAcrilico').value = 0;
            document.getElementById('retiroGel').value = 0;
            document.getElementById('repoAcrilico').value = 0;
            document.getElementById('repoGel').value = 0;
            decoraciones.forEach(d => {
                cantidades[d.nombre] = 0;
                document.getElementById(`cant-${d.nombre}`).textContent = 0;
            });
            calcular();
        }

        init();
        calcular();
    </script>
</body>
                    </html>
